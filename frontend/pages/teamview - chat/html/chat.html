<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LerngruppenTool – Chat</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;700&family=Roboto:wght@400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/chat.css">
</head>
<body>

<div class="page">
    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <svg class="account-circle-icon-1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 5C13.66 5 15 6.34 15 8C15 9.66 13.66 11 12 11C10.34 11 9 9.66 9 8C9 6.34 10.34 5 12 5ZM12 19.2C9.5 19.2 7.29 17.92 6 15.98C6.03 13.99 10 12.9 12 12.9C13.99 12.9 17.97 13.99 18 15.98C16.71 17.92 14.5 19.2 12 19.2Z"/>
                </svg>
            </div>

            <h1 class="lerngruppentool-1">LerngruppenTool</h1>

            <div class="header-right">
                <button class="button-5">Ausloggen</button>
            </div>
        </header>

        <!-- Navigation -->
        <div class="navigation">
            <div class="nav-left">
                <a href="#" class="object-1">
                    <svg class="plain-svg-1" viewBox="0 0 16 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 21L5 12L16 3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Zurück
                </a>
            </div>

            <h2 class="teamname-1">Teamname</h2>

            <div class="nav-right"></div>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="rectangle-1 tab-button">
                <span class="heading-1">Teammitglieder</span>
            </button>
            <button class="rectangle-2 tab-button active">
                <span class="heading-2">Chat</span>
            </button>
            <button class="rectangle-1 tab-button">
                <span class="heading-1">Einstellungen</span>
            </button>
        </div>

        <!-- Chat Section -->
        <h3 class="chat">Chat</h3>

        <!-- Chat Messages Container -->
        <div class="rectangle-4 chat-messages">
            <!-- Nachrichten werden hier angezeigt -->
        </div>

        <!-- Message Input -->
        <div class="message-input-container">
            <input type="text" class="rectangle-5" placeholder="Nachricht schreiben...">
            <button class="send-button">
                <svg class="send-icon-1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>

    </div>
</div>

</body>
</html>
