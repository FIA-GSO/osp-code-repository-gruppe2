<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LerngruppenTool – Login</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

    <div class="page">
        <div class="rectangle-1">

            <h1 class="login">Login</h1>

            <p class="melde-dich-mit-deiner-gso-email-auf-lerngruppentoo">
                Melde dich mit deiner GSO-Email auf LerngruppenTool an!
            </p>

            <!-- Icon -->
            <svg class="account-circle-icon-1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 5C13.66 5 15 6.34 15 8C15 9.66 13.66 11 12 11C10.34 11 9 9.66 9 8C9 6.34 10.34 5 12 5ZM12 19.2C9.5 19.2 7.29 17.92 6 15.98C6.03 13.99 10 12.9 12 12.9C13.99 12.9 17.97 13.99 18 15.98C16.71 17.92 14.5 19.2 12 19.2Z" />
            </svg>
            <form method="POST" action="{{ url_for('auth.login_form') }}">
                <div class="form-group">
                    <label class="mail-adresse">Mail-Adresse</label>
                    <input class="text-input-1" type="email" name="email" placeholder="max@mustermann.com" required>
                </div>

                <div class="form-group">
                    <label class="passwort">Passwort</label>
                    <input class="text-input-2" type="password" name="password" placeholder="***********" required>
                </div>

                <button class="button-1" type="submit">Login</button>

            </form>
            <!-- Formular -->

            <div class="divider">
                <hr class="horizontal-line-2">
                <span class="rectangle-2">Oder</span>
                <hr class="horizontal-line-2">
            </div>


            <a href="{{ url_for('auth.register_form') }}">
                <button class="button-2" type="button">Registrieren</button>
            </a>

        </div>
    </div>

</body>

</html>
