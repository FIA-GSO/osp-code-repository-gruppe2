<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LerngruppenTool – Erkunden</title>
    <link rel="stylesheet" href="../css/overview.css">
</head>
<body>

<div class="app-container">

    <header>
        <div class="header-top">
            <!-- Profil: noch nicht verlinkt -->
            <span class="icon-link" title="Profil (noch nicht verfügbar)">
                <svg class="account-circle-icon-1" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
            </span>

            <!-- Ausloggen: noch nicht verlinkt -->
            <button class="button-5" onclick="return false;" title="Noch nicht verfügbar">Ausloggen</button>
        </div>

        <div class="lerngruppentool">LerngruppenTool</div>

        <div class="search-container">
            <input type="text" class="search-1" placeholder="Suche">
            <svg class="filter-list-icon-1" viewBox="0 0 24 24">
                <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
            </svg>
        </div>
    </header>

    <nav class="nav-controls">
        <!-- Plus-Icon → Gruppe erstellen -->
        <a href="../../createGroup/html/create-group.html" class="icon-link" title="Neue Gruppe erstellen">
            <svg class="add-circle-outline-icon-1" viewBox="0 0 24 24">
                <path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4V7zm-1-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
            </svg>
        </a>

        <div class="btn-group">
            <a href="my-teams.html">
                <button class="tab-inactive">
                    <span class="heading-1">Meine Teams</span>
                </button>
            </a>
            <button class="tab-active">
                <span class="heading-1">Erkunden</span>
            </button>
        </div>
    </nav>

    <main class="cards-container">

        <article class="card">
            <div class="card-header">
                <div class="image-placeholder-1">
                    <svg viewBox="0 0 24 24"><path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.75 7 10 7 10l-6 8h22L14 6z"/></svg>
                </div>
                <div class="card-title-group">
                    <span class="team-label">Team:</span>
                    <a href="#" class="link-1">Mathematik Lerngruppe</a>
                </div>
            </div>
            <div class="text-placeholder-1"></div>
            <div class="card-actions">
                <button class="button-1">Beitreten</button>
                <svg class="flag-icon-1" viewBox="0 0 24 24">
                    <path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/>
                </svg>
            </div>
        </article>

        <article class="card">
            <div class="card-header">
                <div class="image-placeholder-2">
                    <svg viewBox="0 0 24 24"><path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.75 7 10 7 10l-6 8h22L14 6z"/></svg>
                </div>
                <div class="card-title-group">
                    <span class="team-label">Team:</span>
                    <a href="#" class="link-2">Physik Projekt</a>
                </div>
            </div>
            <div class="text-placeholder-2"></div>
            <div class="card-actions">
                <button class="button-4">Beitritt anfragen</button>
                <svg class="flag-icon-2" viewBox="0 0 24 24">
                    <path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/>
                </svg>
            </div>
        </article>

        <article class="card">
            <div class="card-header">
                <div class="image-placeholder-3">
                    <svg viewBox="0 0 24 24"><path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.75 7 10 7 10l-6 8h22L14 6z"/></svg>
                </div>
                <div class="card-title-group">
                    <span class="team-label">Team:</span>
                    <a href="#" class="link-3">Chemie Zusammenfassung</a>
                </div>
            </div>
            <div class="text-placeholder-3"></div>
            <div class="card-actions">
                <button class="button-3">Beitreten</button>
                <svg class="flag-icon-3" viewBox="0 0 24 24">
                    <path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/>
                </svg>
            </div>
        </article>

    </main>
</div>

</body>
</html>
