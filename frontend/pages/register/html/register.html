<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='register/css/register.css') }}">
</head>

<body>

    <div class="rectangle-1">

        <div class="header-nav">
            <svg class="plain-svg-1" viewBox="0 0 12 20" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 1L2 10L11 19" stroke="rgb(3, 122, 255)" stroke-width="2" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <a href="{{ url_for('auth.login_form') }}">
                <span class="object">Zurück</span>
            </a>
            
        </div>

        <div class="content-column">
            <div class="registrieren">Registrieren</div>

            <div class="registriere-dich-mit-deiner-gso-email-auf-lerngrup">
                Registriere dich mit deiner GSO-Email auf LerngruppenTool!
            </div>

            <div style="margin: 1.5rem 0;">
                <svg class="account-circle-icon-1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 5C13.66 5 15 6.34 15 8C15 9.66 13.66 11 12 11C10.34 11 9 9.66 9 8C9 6.34 10.34 5 12 5ZM12 19.2C9.5 19.2 7.29 17.92 6 15.98C6.03 13.99 10 12.9 12 12.9C13.99 12.9 17.97 13.99 18 15.98C16.71 17.92 14.5 19.2 12 19.2Z" />
                </svg>
            </div>

            <div class="input-group">
                <select class="select-1" style="width: 100%;">
                    <option>Klasse auswählen..</option>
                </select>
            </div>

            <div class="row-inputs">
                <div>
                    <div class="vorname">Vorname</div>
                    <input type="text" class="text-input-4" placeholder="Max">
                </div>
                <div>
                    <div class="nachname">Nachname</div>
                    <input type="text" class="text-input-3" placeholder="Mustermann">
                </div>
            </div>

            <div class="input-group">
                <div class="mail-adresse">Mail-Adresse</div>
                <input type="email" class="text-input-1" placeholder="max@mustermann.com">
            </div>

            <div class="input-group">
                <div class="passwort">Passwort</div>
                <input type="password" class="text-input-2" placeholder="***********">
            </div>

            <button class="button-1" style="margin-top: 0.5rem;">Registrieren</button>

            <div class="divider-container">
                <div class="horizontal-line-2"></div>
                <div class="rectangle-2">Oder</div>
            </div>

            <div class="du-hast-schon-einen-account-hier-einloggen">
                Du hast schon einen Account? <span class="footer-link">Hier einloggen</span>
            </div>

        </div>
    </div>

</body>

</html>
