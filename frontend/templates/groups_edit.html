<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Gruppe bearbeiten</title>
</head>
<body>

<h1>Gruppe bearbeiten</h1>

<form method="post">

  <label>Name *</label><br>
  <input type="text" name="name" value="{{ group.name }}" required><br><br>

  <label>Beschreibung</label><br>
  <textarea name="description">{{ group.description or '' }}</textarea><br><br>

  <label>Max. Mitglieder *</label><br>
  <input type="number" name="max_members" min="1" required value="{{ group.max_members or '' }}"><br><br>

  <label>Join Policy</label><br>
  <select name="join_policy">
    <option value="open"   {{ 'selected' if group.join_policy == 'open' }}>Frei beitreten</option>
    <option value="invite" {{ 'selected' if group.join_policy == 'invite' }}>Nur per Einladung</option>
    <option value="closed" {{ 'selected' if group.join_policy == 'closed' }}>Geschlossen</option>
  </select><br><br>

  <button type="submit">Speichern</button>
</form>

<p>
  <a href="{{ url_for('groups.show_group', group_id=group.group_id) }}">Abbrechen</a>
</p>

</body>
</html>
