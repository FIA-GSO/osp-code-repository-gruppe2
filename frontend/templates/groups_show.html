<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Gruppe – {{ group.name }}</title>
</head>
<body>

<h1>{{ group.name }}</h1>

<p><strong>Beschreibung:</strong> {{ group.description or '–' }}</p>
<p><strong>Max. Mitglieder:</strong> {{ group.max_members or '–' }}</p>
<p><strong>Join-Policy:</strong> {{ group.join_policy or '–' }}</p>
<p><strong>Erstellt am:</strong> {{ group.created_at or '–' }}</p>

<form method="post"
      action="{{ url_for('groups.delete_group', group_id=group.group_id) }}"
      onsubmit="return confirm('Gruppe wirklich löschen?');">
  <button type="submit">🗑 Gruppe löschen</button>
</form>

<p>
  <a href="{{ url_for('groups.edit_group_form', group_id=group.group_id) }}">✏️ Bearbeiten</a>
</p>

<p>
  <a href="{{ url_for('groups.list_groups') }}">&larr; Zurück zur Liste</a>
</p>

</body>
</html>
