<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Neue Gruppe erstellen</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 800px; }
    form { display: grid; grid-template-columns: 200px 1fr; gap: .5rem 1rem; }
    label { align-self: center; }
    input[type="text"], textarea, select, input[type="number"] { width: 100%; padding: .5rem; }
    .row { display: contents; }
    .actions { grid-column: 1 / -1; margin-top: 1rem; }
    .flash { padding: .5rem .75rem; margin: .5rem 0; border-radius: 4px; }
    .flash.success { background: #e7f6ec; color: #236b3b; }
    .flash.error { background: #fde8e8; color: #9b1c1c; }
  </style>
</head>
<body>
<h1>Neue Gruppe erstellen</h1>
<p><a href="{{ url_for('groups.list_groups') }}">&larr; Zurück zur Liste</a></p>

{% with messages = get_flashed_messages(with_categories=True) %}
{% if messages %}
{% for category, msg in messages %}
<div class="flash {{ category }}">{{ msg }}</div>
{% endfor %}
{% endif %}
{% endwith %}

<form action="{{ url_for('groups.create_group') }}" method="post" novalidate>
  <div class="row">
    <label for="name">Name *</label>
    <input type="text" id="name" name="name" required value="{{ (form.name if form else '') or '' }}" />
  </div>

  <div class="row">
    <label for="description">Beschreibung</label>
    <textarea id="description" name="description" rows="4">{{ (form.description if form else '') or '' }}</textarea>
  </div>

  <div class="row">
    <label for="leader_id">Leiter:in *</label>
    <select id="leader_id" name="leader_id" required>
      <option value="">-- auswählen --</option>
      {% for u in users %}
      {# Wenn user_id bytes ist: hex anzeigen; sonst String #}
      {% if u.user_id.__class__.__name__ in ('bytes', 'bytearray') %}
      {% set uid = u.user_id.hex() %}
      {% else %}
      {% set uid = u.user_id %}
      {% endif %}
      <option value="{{ uid }}">{{ u.first_name }} {{ u.last_name }} ({{ u.email }})</option>
      {% endfor %}
    </select>
  </div>

  <div class="row">
    <label for="max_members">Max. Mitglieder *</label>
    <input type="number" id="max_members" name="max_members" min="1" step="1" required
           value="{{ (form.max_members if form else '') or '' }}" />
  </div>

  <div class="row">
    <label for="join_policy">Join-Policy</label>
    <select id="join_policy" name="join_policy">
      <option value="open" {{ 'selected' if (form.join_policy if form else '') == 'open' }}>Frei beitreten</option>
      <option value="invite" {{ 'selected' if (form.join_policy if form else '') != 'open' }}>Nur per Einladung</option>
      <option value="closed" {{ 'selected' if (form.join_policy if form else '') == 'closed' }}>Geschlossen</option>
    </select>
  </div>

  <div class="actions">
    <button type="submit">Erstellen</button>
  </div>
</form>
</body>
</html>
